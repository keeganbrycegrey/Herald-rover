twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5          # if the dashboard stops sending, this input expires
        priority: 100
      nav:
        topic: /cmd_vel       # Nav2's velocity_smoother output, default topic name
        timeout: 0.5
        priority: 10

    locks:
      manual_override:
        topic: /manual_override_lock
        timeout: 0.0          # 0 = lock has no expiry, stays until explicitly cleared
        priority: 50          # blocks anything with priority < 50 (i.e. blocks 'nav')

    cmd_vel_out: /cmd_vel_mux_out
